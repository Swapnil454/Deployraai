<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 205" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="background:#111111; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', monospace, sans-serif;">
  <style>
    /* Responsive User Interactive Hover */
    .station-node {
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .station-node:hover .node-core {
      r: 2.6px;
      filter: drop-shadow(0 0 4px currentColor);
    }
    .station-node:hover .node-ring {
      stroke-opacity: 0.9;
      stroke-width: 0.9px;
    }
    .station-node:hover .station-title {
      fill: #ffffff !important;
      text-shadow: 0 0 5px rgba(255,255,255,0.5);
    }
    .station-node:hover .station-desc {
      fill: #e2e8f0 !important;
    }
    .bus-group {
      cursor: pointer;
    }
    .bus-group:hover path {
      stroke-opacity: 1 !important;
    }
  </style>

  <defs>
    <!-- Micro Dot Grid Background -->
    <pattern id="dot-grid-nano" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.4" fill="#1b2027" />
    </pattern>

    <!-- Multi-line Gradients -->
    <linearGradient id="bg-cyan-nano" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="bg-loop-nano" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="bg-alert-nano" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="bg-heal-nano" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Clean Dark Canvas -->
  <rect width="340" height="205" fill="#111111" />
  <rect width="340" height="205" fill="url(#dot-grid-nano)" />

  <!-- Clean Top Header HUD (Pill Badge - No Text Collisions) -->
  <g transform="translate(14, 10)">
    <rect x="0" y="0" width="102" height="13" rx="2.5" fill="#141a22" stroke="#253242" stroke-width="0.6"/>
    <circle cx="5" cy="6.5" r="1.3" fill="#2dd4bf"/>
    <text x="10" y="9.2" fill="#2dd4bf" font-size="5" font-weight="700" letter-spacing="0.6">OUTAGE PREVENTION</text>

    <text x="108" y="9.2" fill="#64748b" font-size="4.8">Self-healing pre-flight architecture</text>
    <text x="282" y="9.2" fill="#2dd4bf" font-family="monospace" font-size="4.8">● 0ms IMPACT</text>
  </g>

  <!-- ================= 3-LANE THIN CIRCUIT HIGHWAY ================= -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- TRACK 1: Station 1 -> Station 2 -->
    <g class="bus-group">
      <path d="M 124 38 L 268 38 C 278 38, 283 44, 283 56 L 283 68 C 283 76, 278 80, 268 80 L 254 80" stroke="#1c2432" stroke-width="0.5"/>
      <path id="nano-t1" d="M 124 39.5 L 268 39.5 C 276 39.5, 281.5 45, 281.5 56 L 281.5 68 C 281.5 75, 276 78.5, 268 78.5 L 254 78.5" stroke="url(#bg-cyan-nano)" stroke-width="0.7"/>
      <path d="M 124 41 L 268 41 C 274 41, 280 46, 280 56 L 280 68 C 280 74, 274 77, 268 77 L 254 77" stroke="#1c2432" stroke-width="0.5"/>

      <!-- Animated Data Pulse 1 -->
      <circle r="0.9" fill="#2dd4bf">
        <animateMotion path="M 124 39.5 L 268 39.5 C 276 39.5, 281.5 45, 281.5 56 L 281.5 68 C 281.5 75, 276 78.5, 268 78.5 L 254 78.5" dur="1.6s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- TRACK 2: Station 2 -> Station 3 -->
    <g class="bus-group">
      <path d="M 148 77 L 54 77 C 44 77, 39 84, 39 96 L 39 116 C 39 126, 44 130, 54 130 L 64 130" stroke="#1c2432" stroke-width="0.5"/>
      <path id="nano-t2" d="M 148 78.5 L 54 78.5 C 45 78.5, 40.5 85, 40.5 96 L 40.5 116 C 40.5 125, 45 128.5, 54 128.5 L 64 128.5" stroke="url(#bg-loop-nano)" stroke-width="0.7"/>
      <path d="M 148 80 L 54 80 C 46 80, 42 86, 42 96 L 42 116 C 42 124, 46 127, 54 127 L 64 127" stroke="#1c2432" stroke-width="0.5"/>

      <!-- Animated Data Pulse 2 -->
      <circle r="0.9" fill="#38bdf8">
        <animateMotion path="M 148 78.5 L 54 78.5 C 45 78.5, 40.5 85, 40.5 96 L 40.5 116 C 40.5 125, 45 128.5, 54 128.5 L 64 128.5" dur="1.5s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- TRACK 3: Station 3 Outbound to Fork -->
    <g class="bus-group">
      <path d="M 166 127 L 198 127" stroke="#1c2432" stroke-width="0.5"/>
      <path d="M 166 128.5 L 200 128.5" stroke="#38bdf8" stroke-width="0.7"/>
      <path d="M 166 130 L 198 130" stroke="#1c2432" stroke-width="0.5"/>
    </g>

    <!-- Upper Fork -> 4A. Video Replay Alert -->
    <g class="bus-group">
      <path d="M 198 127 L 206 127 C 212 127, 216 122, 216 114 L 216 107 C 216 102, 220 99, 226 99 L 236 99" stroke="#1c2432" stroke-width="0.5"/>
      <path id="nano-fork-a" d="M 200 128.5 L 207 128.5 C 213 128.5, 217 123, 217 114 L 217 107 C 217 103, 221 100, 227 100 L 236 100" stroke="url(#bg-alert-nano)" stroke-width="0.7"/>
      <path d="M 198 130 L 205 130 C 211 130, 215 124, 215 114 L 215 107 C 215 104, 219 101, 225 101 L 236 101" stroke="#2a2316" stroke-width="0.5"/>

      <circle r="0.9" fill="#fbbf24">
        <animateMotion path="M 200 128.5 L 207 128.5 C 213 128.5, 217 123, 217 114 L 217 107 C 217 103, 221 100, 227 100 L 236 100" dur="0.8s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Lower Fork -> 4B. Automatic Rollback -->
    <g class="bus-group">
      <path d="M 198 127 L 205 127 C 211 127, 215 133, 215 142 L 215 156 C 215 162, 219 165, 225 165 L 236 165" stroke="#1c2432" stroke-width="0.5"/>
      <path id="nano-fork-b" d="M 200 128.5 L 207 128.5 C 213 128.5, 217 134, 217 142 L 217 156 C 217 163, 221 166, 227 166 L 236 166" stroke="url(#bg-heal-nano)" stroke-width="0.7"/>
      <path d="M 198 130 L 206 130 C 212 130, 216 135, 216 142 L 216 156 C 216 164, 220 167, 226 167 L 236 167" stroke="#162e24" stroke-width="0.5"/>

      <circle r="0.9" fill="#2dd4bf">
        <animateMotion path="M 200 128.5 L 207 128.5 C 213 128.5, 217 134, 217 142 L 217 156 C 217 163, 221 166, 227 166 L 236 166" dur="0.8s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>


  <!-- ================= STATION 1: LIVE USER ACTIONS ================= -->
  <g class="station-node" transform="translate(14, 31)">
    <circle class="node-ring" cx="2.5" cy="8.5" r="3" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="0.5" fill="none"/>
    <circle class="node-core" cx="2.5" cy="8.5" r="1.5" fill="#2dd4bf"/>
    
    <text class="station-title" x="8" y="7" fill="#ffffff" font-size="6.8" font-weight="700">1. Live User Actions</text>
    <text class="station-desc" x="8" y="14" fill="#94a3b8" font-size="4.7">Every click &amp; visit is buffered in real time</text>
    <text class="station-desc" x="8" y="20" fill="#64748b" font-size="4.5">PII-masked with 0ms user latency</text>
  </g>


  <!-- ================= STATION 2: PRE-RELEASE SANDBOX ================= -->
  <g class="station-node" transform="translate(145, 68)">
    <text class="station-title" x="100" y="7" text-anchor="end" fill="#ffffff" font-size="6.8" font-weight="700">2. Pre-Release Sandbox</text>
    <text class="station-desc" x="100" y="14" text-anchor="end" fill="#94a3b8" font-size="4.7">Replays live traffic on secret canary server</text>
    <text class="station-desc" x="100" y="20" text-anchor="end" fill="#64748b" font-size="4.5">Tests code before customers ever reach it</text>

    <circle class="node-ring" cx="109" cy="8.5" r="3" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="0.5" fill="none"/>
    <circle class="node-core" cx="109" cy="8.5" r="1.5" fill="#2dd4bf"/>
  </g>


  <!-- ================= STATION 3: INSTANT BUG RADAR ================= -->
  <g class="station-node" transform="translate(64, 120)">
    <circle class="node-ring" cx="2.5" cy="8.5" r="3" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="0.5" fill="none"/>
    <circle class="node-core" cx="2.5" cy="8.5" r="1.5" fill="#38bdf8"/>

    <text class="station-title" x="8" y="7" fill="#ffffff" font-size="6.8" font-weight="700">3. Instant Bug Radar</text>
    <text class="station-desc" x="8" y="14" fill="#94a3b8" font-size="4.7">Sensors detect crashes &amp; memory spikes</text>
    <text class="station-desc" x="8" y="20" fill="#64748b" font-size="4.5">Catches silent 5xx errors in microseconds</text>
  </g>


  <!-- ================= STATION 4A: VIDEO REPLAY ALERT ================= -->
  <g class="station-node" transform="translate(238, 91)">
    <circle class="node-ring" cx="2.5" cy="8.5" r="3" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="0.5" fill="none"/>
    <circle class="node-core" cx="2.5" cy="8.5" r="1.5" fill="#fbbf24"/>

    <text class="station-title" x="8" y="7" fill="#fbbf24" font-size="6.8" font-weight="700">4A. Video Replay Alert</text>
    <text class="station-desc" x="8" y="14" fill="#d4b483" font-size="4.7">Slack/PagerDuty alert in &lt;100ms</text>
    <text class="station-desc" x="8" y="20" fill="#887968" font-size="4.5">Includes exact video replay of the bug</text>
  </g>


  <!-- ================= STATION 4B: AUTOMATIC ROLLBACK ================= -->
  <g class="station-node" transform="translate(238, 157)">
    <circle class="node-ring" cx="2.5" cy="8.5" r="3" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="0.5" fill="none"/>
    <circle class="node-core" cx="2.5" cy="8.5" r="1.5" fill="#2dd4bf"/>

    <text class="station-title" x="8" y="7" fill="#2dd4bf" font-size="6.8" font-weight="700">4B. Automatic Rollback</text>
    <text class="station-desc" x="8" y="14" fill="#5eead4" font-size="4.7">Drains faulty code in 12 milliseconds</text>
    <text class="station-desc" x="8" y="20" fill="#678a7c" font-size="4.5">Restores safe version with 0% downtime</text>
  </g>
</svg>
