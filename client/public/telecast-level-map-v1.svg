<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="100%" height="100%" style="background:#111111; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', monospace, sans-serif;">
  <defs>
    <!-- Dot Matrix Background Pattern -->
    <pattern id="dot-grid-v1" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#252932" />
    </pattern>

    <!-- Linear Gradients for Circuit Lines -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00d9f5" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="alert-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9f5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="heal-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9f5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Marker Chevrons for Direction -->
    <marker id="chevron-cyan" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 6 5 L 1 9" fill="none" stroke="#00f5a0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="chevron-amber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 6 5 L 1 9" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="chevron-emerald" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 6 5 L 1 9" fill="none" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <!-- Card Shadow Filter -->
    <filter id="card-shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="1600" height="920" fill="#111111" />
  <rect width="1600" height="920" fill="url(#dot-grid-v1)" />

  <!-- Section Header -->
  <g transform="translate(80, 56)">
    <rect x="0" y="0" width="124" height="24" rx="4" fill="#19202a" stroke="#2a3342" stroke-width="1"/>
    <text x="10" y="16" fill="#00f5a0" font-size="11" font-weight="700" letter-spacing="1">LIVE ARCHITECTURE</text>
    <text x="0" y="52" fill="#ffffff" font-size="24" font-weight="700" letter-spacing="-0.5">Pre-Emptive Incident Telecast &amp; Self-Healing Pipeline</text>
    <text x="0" y="74" fill="#717a8c" font-size="13">Continuous microsecond DOM stream replay, shadow canary isolation, and zero-exposure autonomous rollback.</text>
  </g>

  <!-- ================= CIRCUIT TRANSIT TRACKS ================= -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Inbound Bus (Left to L1) -->
    <path d="M 20 630 L 76 630" stroke="#272d38" stroke-width="2"/>
    <path d="M 20 640 L 76 640" stroke="#00f5a0" stroke-width="2" marker-mid="url(#chevron-cyan)"/>
    <path d="M 20 650 L 76 650" stroke="#272d38" stroke-width="2"/>

    <!-- Track: Level 1 to Level 2 (Canary Divergence) -->
    <!-- Triple circuit lines -->
    <path d="M 360 635 L 400 635 L 436 635" stroke="#272d38" stroke-width="2"/>
    <path d="M 360 645 L 400 645 L 436 645" stroke="#00f5a0" stroke-width="2" marker-end="url(#chevron-cyan)"/>
    <path d="M 360 655 L 400 655 L 436 655" stroke="#272d38" stroke-width="2"/>

    <!-- Track: Level 1 & 2 merging into Level 3 (Radar) -->
    <!-- Line 1: Upper express route from L1 -->
    <path d="M 320 600 L 380 500 L 720 500 L 760 500 L 776 500" stroke="#272d38" stroke-width="2"/>
    <!-- Line 2: Main synced telemetry from L2 -->
    <path d="M 720 640 L 750 640 L 780 550 L 796 550" stroke="#00d9f5" stroke-width="2" marker-mid="url(#chevron-cyan)"/>
    <path d="M 720 650 L 745 650 L 775 560 L 796 560" stroke="#272d38" stroke-width="2"/>

    <!-- Track: Level 3 Outbound to Fork Point -->
    <path d="M 1070 480 L 1110 480" stroke="#272d38" stroke-width="2"/>
    <path d="M 1070 490 L 1120 490" stroke="#00d9f5" stroke-width="2"/>
    <path d="M 1070 500 L 1110 500" stroke="#272d38" stroke-width="2"/>

    <!-- Branch Upward: Fork to Level 4 (Instant Alert & Video Telecast Hub) -->
    <path d="M 1120 490 L 1150 490 L 1170 470 L 1170 230 L 1196 230" stroke="url(#alert-glow)" stroke-width="2.5" marker-end="url(#chevron-amber)"/>
    <path d="M 1110 480 L 1146 480 L 1162 464 L 1162 220 L 1196 220" stroke="#272d38" stroke-width="2"/>
    <path d="M 1110 500 L 1140 500 L 1178 462 L 1178 240 L 1196 240" stroke="#272d38" stroke-width="2"/>

    <!-- Branch Downward: Fork to Level 5 (Autonomous Rollback & Isolation) -->
    <path d="M 1120 490 L 1150 490 L 1170 510 L 1170 710 L 1196 710" stroke="url(#heal-glow)" stroke-width="2.5" marker-end="url(#chevron-emerald)"/>
    <path d="M 1110 480 L 1140 480 L 1162 502 L 1162 700 L 1196 700" stroke="#272d38" stroke-width="2"/>
    <path d="M 1110 500 L 1146 500 L 1178 518 L 1178 720 L 1196 720" stroke="#272d38" stroke-width="2"/>

    <!-- Feedback Loop: Level 5 Self-Heal back to Level 2 Canary Isolation -->
    <path d="M 1340 820 L 1340 860 L 580 860 L 580 770" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#chevron-emerald)"/>
  </g>

  <!-- Route Pulse Indicators & Labels -->
  <g font-size="10" font-family="monospace">
    <!-- Route 1 Label -->
    <rect x="370" y="618" width="54" height="16" rx="3" fill="#141820" stroke="#272d38"/>
    <text x="375" y="630" fill="#00f5a0">120μs</text>

    <!-- Route 2 Label -->
    <rect x="735" y="575" width="56" height="16" rx="3" fill="#141820" stroke="#272d38"/>
    <text x="740" y="587" fill="#00d9f5">MIRROR</text>

    <!-- Branch Up Label -->
    <rect x="1136" y="340" width="68" height="16" rx="3" fill="#141820" stroke="#3b2b18"/>
    <text x="1142" y="352" fill="#f59e0b">CRITICAL</text>

    <!-- Branch Down Label -->
    <rect x="1136" y="590" width="68" height="16" rx="3" fill="#141820" stroke="#163324"/>
    <text x="1142" y="602" fill="#10b981">AUTOPR</text>

    <!-- Feedback Route Label -->
    <text x="940" y="852" fill="#10b981" font-size="10">AUTONOMOUS FEEDBACK LOOP (CANARY DRAIN &amp; RE-DEPLOY)</text>
  </g>


  <!-- ================= LEVEL 1: DOM & EVENT CAPTURE ================= -->
  <g transform="translate(80, 540)" filter="url(#card-shadow)">
    <!-- Card Frame -->
    <rect width="280" height="210" rx="8" fill="#141820" stroke="#27303f" stroke-width="1.2"/>
    <!-- Level Badge -->
    <rect x="16" y="16" width="64" height="18" rx="3" fill="#1c2433" stroke="#2d394e"/>
    <text x="24" y="29" fill="#00f5a0" font-size="10" font-weight="700" letter-spacing="1">LEVEL 01</text>
    <circle cx="254" cy="25" r="4" fill="#00f5a0"/>

    <!-- Title -->
    <text x="16" y="56" fill="#ffffff" font-size="15" font-weight="700">DOM &amp; Event Capture</text>
    <text x="16" y="74" fill="#717a8c" font-size="11">Client-side microsecond stream tap</text>

    <line x1="16" y1="88" x2="264" y2="88" stroke="#1f2633" stroke-width="1"/>

    <!-- Level Feature Specs -->
    <g transform="translate(16, 106)" font-size="11" fill="#cbd5e1">
      <circle cx="4" cy="0" r="2.5" fill="#00f5a0"/>
      <text x="14" y="3">rrweb DOM Mutation Buffer</text>

      <circle cx="4" cy="22" r="2.5" fill="#00f5a0"/>
      <text x="14" y="25">Microsecond Clock (1μs Sync)</text>

      <circle cx="4" cy="44" r="2.5" fill="#00f5a0"/>
      <text x="14" y="47">Client-Side PII Redaction Mask</text>

      <circle cx="4" cy="66" r="2.5" fill="#00f5a0"/>
      <text x="14" y="69">Fastify Ingestor (240k ev/s)</text>
    </g>
  </g>


  <!-- ================= LEVEL 2: PRE-FLIGHT CANARY REPLAYER ================= -->
  <g transform="translate(440, 540)" filter="url(#card-shadow)">
    <!-- Card Frame -->
    <rect width="280" height="210" rx="8" fill="#141820" stroke="#27303f" stroke-width="1.2"/>
    <!-- Level Badge -->
    <rect x="16" y="16" width="64" height="18" rx="3" fill="#1c2433" stroke="#2d394e"/>
    <text x="24" y="29" fill="#00d9f5" font-size="10" font-weight="700" letter-spacing="1">LEVEL 02</text>
    <circle cx="254" cy="25" r="4" fill="#00d9f5"/>

    <!-- Title -->
    <text x="16" y="56" fill="#ffffff" font-size="15" font-weight="700">Pre-Flight Canary Replay</text>
    <text x="16" y="74" fill="#717a8c" font-size="11">Shadow testing before user exposure</text>

    <line x1="16" y1="88" x2="264" y2="88" stroke="#1f2633" stroke-width="1"/>

    <!-- Level Feature Specs -->
    <g transform="translate(16, 106)" font-size="11" fill="#cbd5e1">
      <circle cx="4" cy="0" r="2.5" fill="#00d9f5"/>
      <text x="14" y="3">Shadow Session Telecast</text>

      <circle cx="4" cy="22" r="2.5" fill="#00d9f5"/>
      <text x="14" y="25">Headless Synthetic Simulation</text>

      <circle cx="4" cy="44" r="2.5" fill="#00d9f5"/>
      <text x="14" y="47">Zero-User Crash Barrier</text>

      <circle cx="4" cy="66" r="2.5" fill="#00d9f5"/>
      <text x="14" y="69">Staging &amp; Production Diff Check</text>
    </g>
  </g>


  <!-- ================= LEVEL 3: INCIDENT ANOMALY RADAR ================= -->
  <g transform="translate(796, 380)" filter="url(#card-shadow)">
    <!-- Card Frame -->
    <rect width="274" height="210" rx="8" fill="#141820" stroke="#374151" stroke-width="1.2"/>
    <!-- Level Badge -->
    <rect x="16" y="16" width="64" height="18" rx="3" fill="#1c2433" stroke="#2d394e"/>
    <text x="24" y="29" fill="#38bdf8" font-size="10" font-weight="700" letter-spacing="1">LEVEL 03</text>
    <circle cx="248" cy="25" r="4" fill="#38bdf8"/>

    <!-- Title -->
    <text x="16" y="56" fill="#ffffff" font-size="15" font-weight="700">Incident Anomaly Radar</text>
    <text x="16" y="74" fill="#717a8c" font-size="11">Microsecond telemetry evaluation</text>

    <line x1="16" y1="88" x2="258" y2="88" stroke="#1f2633" stroke-width="1"/>

    <!-- Level Feature Specs -->
    <g transform="translate(16, 106)" font-size="11" fill="#cbd5e1">
      <circle cx="4" cy="0" r="2.5" fill="#38bdf8"/>
      <text x="14" y="3">Sub-millisecond Error Spike Tripwire</text>

      <circle cx="4" cy="22" r="2.5" fill="#38bdf8"/>
      <text x="14" y="25">Memory Leak &amp; CPU Throttle Radar</text>

      <circle cx="4" cy="44" r="2.5" fill="#38bdf8"/>
      <text x="14" y="47">HTTP 5xx Micro-Spike Filter</text>

      <circle cx="4" cy="66" r="2.5" fill="#38bdf8"/>
      <text x="14" y="69">Autonomous Severity Classification</text>
    </g>
  </g>


  <!-- ================= LEVEL 4: INSTANT TELECAST & ALERT HUB ================= -->
  <g transform="translate(1200, 120)" filter="url(#card-shadow)">
    <!-- Card Frame -->
    <rect width="320" height="220" rx="8" fill="#16181f" stroke="#4a3b22" stroke-width="1.2"/>
    <!-- Level Badge -->
    <rect x="16" y="16" width="68" height="18" rx="3" fill="#2d2214" stroke="#4a371c"/>
    <text x="24" y="29" fill="#f59e0b" font-size="10" font-weight="700" letter-spacing="1">LEVEL 04</text>
    <circle cx="294" cy="25" r="4" fill="#f59e0b"/>

    <!-- Title -->
    <text x="16" y="56" fill="#ffffff" font-size="15" font-weight="700">Instant Telecast &amp; Alert Hub</text>
    <text x="16" y="74" fill="#f59e0b" font-size="11">Broadcast with live video reproduction link</text>

    <line x1="16" y1="88" x2="304" y2="88" stroke="#2d261a" stroke-width="1"/>

    <!-- Level Feature Specs -->
    <g transform="translate(16, 106)" font-size="11" fill="#cbd5e1">
      <circle cx="4" cy="0" r="2.5" fill="#f59e0b"/>
      <text x="14" y="3">100% DOM Session Replay Video</text>

      <circle cx="4" cy="22" r="2.5" fill="#f59e0b"/>
      <text x="14" y="25">Slack, PagerDuty &amp; Webhook Blast</text>

      <circle cx="4" cy="44" r="2.5" fill="#f59e0b"/>
      <text x="14" y="47">Exact Click &amp; Network Call Stacktrace</text>

      <circle cx="4" cy="66" r="2.5" fill="#f59e0b"/>
      <text x="14" y="69">Zero Developer Triage Delay (0s)</text>
    </g>
  </g>


  <!-- ================= LEVEL 5: AUTONOMOUS ROLLBACK & HEAL ================= -->
  <g transform="translate(1200, 600)" filter="url(#card-shadow)">
    <!-- Card Frame -->
    <rect width="320" height="220" rx="8" fill="#131b18" stroke="#1e4033" stroke-width="1.2"/>
    <!-- Level Badge -->
    <rect x="16" y="16" width="68" height="18" rx="3" fill="#152e22" stroke="#1f4834"/>
    <text x="24" y="29" fill="#10b981" font-size="10" font-weight="700" letter-spacing="1">LEVEL 05</text>
    <circle cx="294" cy="25" r="4" fill="#10b981"/>

    <!-- Title -->
    <text x="16" y="56" fill="#ffffff" font-size="15" font-weight="700">Autonomous Rollback &amp; Heal</text>
    <text x="16" y="74" fill="#10b981" font-size="11">Zero-downtime automated recovery</text>

    <line x1="16" y1="88" x2="304" y2="88" stroke="#1a3528" stroke-width="1"/>

    <!-- Level Feature Specs -->
    <g transform="translate(16, 106)" font-size="11" fill="#cbd5e1">
      <circle cx="4" cy="0" r="2.5" fill="#10b981"/>
      <text x="14" y="3">Instant Canary Pod Drain (12ms)</text>

      <circle cx="4" cy="22" r="2.5" fill="#10b981"/>
      <text x="14" y="25">Automated Git Rollback to Healthy Hash</text>

      <circle cx="4" cy="44" r="2.5" fill="#10b981"/>
      <text x="14" y="47">Self-Healing Hotfix PR Generation</text>

      <circle cx="4" cy="66" r="2.5" fill="#10b981"/>
      <text x="14" y="69">User Outage Exposure = 0%</text>
    </g>
  </g>
</svg>
