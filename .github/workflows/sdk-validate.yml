name: Validate SDKs (Dry Run)

on:
  pull_request:
    paths:
      - 'packages/sdk/**'
      - 'packages/sdk-python/**'

jobs:
  validate-npm:
    name: Validate NPM Packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Turbo
        run: npm install -g turbo

      - name: Install Dependencies
        run: npm ci

      - name: Build SDK
        run: turbo run build --filter=@swapnil454/tracepilot

      - name: Run Tests
        run: npm test -w packages/sdk

      - name: Dry Run Publish
        working-directory: packages/sdk
        run: npm publish --dry-run

  validate-pypi:
    name: Validate PyPI Packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2

      - name: Install Dependencies
        working-directory: packages/sdk-python
        run: poetry install --no-interaction

      - name: Run Tests
        working-directory: packages/sdk-python
        run: poetry run pytest

      - name: Build Wheel
        working-directory: packages/sdk-python
        run: poetry build
