name: Validate SDKs

on:
  pull_request:
    paths:
      - "packages/sdk/**"
      - "packages/sdk-python/**"
      - "packages/sdk-go/**"
      - ".github/workflows/**"

jobs:
  validate-npm:
    name: Validate npm SDK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Build SDK
        run: npm run build

      - name: Dry Run Publish
        run: npm publish --dry-run

  validate-python:
    name: Validate Python SDK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/sdk-python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pytest

      - name: Run tests
        run: pytest || echo "No tests found"

      - name: Clean old builds
        run: rm -rf dist build *.egg-info

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

  validate-go:
    name: Validate Go SDK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/sdk-go

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download dependencies
        run: go mod download

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Build Go SDK
        run: go build ./...
