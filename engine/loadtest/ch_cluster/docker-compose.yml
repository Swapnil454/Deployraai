name: chcluster
services:
  ch_keeper:
    image: clickhouse/clickhouse-server:24.3
    container_name: ch_keeper
    entrypoint: ["clickhouse","keeper","--config-file=/etc/ch/keeper.xml"]
    volumes: ["./keeper.xml:/etc/ch/keeper.xml:ro"]
    networks: [ch_cluster_net]
    mem_limit: 512m
  ch_node1:
    image: clickhouse/clickhouse-server:24.3
    container_name: ch_node1
    environment:
      CLICKHOUSE_USER: engine
      CLICKHOUSE_PASSWORD: password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes: ["./node1.xml:/etc/clickhouse-server/config.d/cluster.xml:ro"]
    depends_on: [ch_keeper]
    networks: [ch_cluster_net]
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
  ch_node2:
    image: clickhouse/clickhouse-server:24.3
    container_name: ch_node2
    environment:
      CLICKHOUSE_USER: engine
      CLICKHOUSE_PASSWORD: password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes: ["./node2.xml:/etc/clickhouse-server/config.d/cluster.xml:ro"]
    depends_on: [ch_keeper]
    networks: [ch_cluster_net]
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
networks:
  ch_cluster_net:
    name: ch_cluster_net
